name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
          POSTGRES_DB: ecom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecom" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: ecom_test
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      REDIS_URL: redis://localhost:6379/0
      API_SECRET_KEY: ci-secret
      API_ENV: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry && poetry install --no-root
      - run: poetry run ruff check .
      - run: poetry run mypy app || true
      - run: poetry run alembic upgrade head
      - run: poetry run pytest -q

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build
