name: Deploy VPS

# Publicação automática. Dois caminhos, redundantes:
#  1) o timer systemd `cater-deploy.timer` no servidor faz git pull a cada 2 min;
#  2) este workflow (deploy imediato) — só roda se os secrets VPS_* existirem.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # sem os secrets configurados o job é ignorado (não falha)
    if: ${{ vars.VPS_ENABLED == 'true' }}
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -e
            cd /opt/cater
            git fetch --all --prune
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
