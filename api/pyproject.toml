[tool.poetry]
name = "ecom-api"
version = "0.1.0"
description = "E-commerce API (FastAPI async, modular)"
authors = ["Lucas Savio <lucas.savio029@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
# 0.141+: rotas 204 com `-> None` (a 0.115 quebrava no boot). Alinha com o
# ambiente de dev, onde a app roda com fastapi 0.141 / starlette 1.6.
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = {extras = ["email"], version = "^2.9.0"}
pydantic-settings = "^2.5.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
alembic = "^1.13.0"
asyncpg = "^0.30.0"
redis = "^5.1.0"
argon2-cffi = "^23.1.0"
pyjwt = "^2.9.0"
python-multipart = "^0.0.12"
pillow = "^11.0.0"
httpx = "^0.27.0"
python-slugify = "^8.0.4"
aiosmtplib = "^3.0.2"
jinja2 = "^3.1.4"
tenacity = "^9.0.0"
nh3 = "^0.2.18"
pyotp = "^2.9.0"
segno = "^1.6.1"
paramiko = "^3.4"
tzdata = "^2024.1"
pypdf = "^6.0"
playwright = "^1.48"
ppf-datamatrix = "^0.2"
python-barcode = "^0.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
mypy = "^1.11.0"
asgi-lifespan = "^2.1.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E501 (linha longa): estilo, deixamos o formatter cuidar disso.
# SIM105/SIM108: contextlib.suppress e ternário nem sempre ficam mais claros.
ignore = ["E501", "SIM105", "SIM108"]

[tool.ruff.lint.flake8-bugbear]
# chamadas de fábrica do FastAPI em defaults de parâmetro são idiomáticas (não é bug B008)
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Cookie", "fastapi.File", "fastapi.Form", "fastapi.Body", "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
