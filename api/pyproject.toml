[tool.poetry]
name = "ecom-api"
version = "0.1.0"
description = "E-commerce API (FastAPI async, modular)"
authors = ["Lucas Savio <lucas.savio029@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = {extras = ["email"], version = "^2.9.0"}
pydantic-settings = "^2.5.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
alembic = "^1.13.0"
asyncpg = "^0.30.0"
redis = "^5.1.0"
argon2-cffi = "^23.1.0"
pyjwt = "^2.9.0"
python-multipart = "^0.0.12"
pillow = "^11.0.0"
httpx = "^0.27.0"
python-slugify = "^8.0.4"
aiosmtplib = "^3.0.2"
jinja2 = "^3.1.4"
tenacity = "^9.0.0"
nh3 = "^0.2.18"
pyotp = "^2.9.0"
segno = "^1.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
mypy = "^1.11.0"
asgi-lifespan = "^2.1.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
