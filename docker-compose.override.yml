# ============================================================
#  Override de DEV — carregado automaticamente por `docker compose up`.
#  Hot reload, portas publicadas (só máquina local), mailpit.
# ============================================================
services:
  api:
    build:
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      API_ENV: dev
    volumes:
      - ./api:/app
      - media:/data/media
    ports:
      - "8000:8000"

  frontend:
    build:
      target: dev
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/repo/frontend
      - ./packages:/repo/packages
      - frontend_node_modules:/repo/node_modules
      - frontend_next:/repo/frontend/.next
    ports:
      - "3000:3000"

  admin:
    build:
      target: dev
    command: ["npm", "run", "dev"]
    volumes:
      - ./admin:/repo/admin
      - ./packages:/repo/packages
      - admin_node_modules:/repo/node_modules
      - admin_next:/repo/admin/.next
    ports:
      - "3001:3001"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # UI web do mailpit
    networks: [internal]

volumes:
  frontend_node_modules:
  frontend_next:
  admin_node_modules:
  admin_next:
