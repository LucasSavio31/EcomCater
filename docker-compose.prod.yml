# ============================================================
#  Override de PROD.
#  Sem domínio: publicação DIRETA no IP com HTTPS (certificado autoassinado).
#  O container `proxy` (nginx) termina o TLS nas portas 3000/3001/8000 e
#  encaminha para os apps na rede interna. O certificado fica em
#  /opt/cater/certs no servidor (fora do git).
#  Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ============================================================
services:
  proxy:
    image: nginx:1.27-alpine
    container_name: cater-proxy
    restart: unless-stopped
    depends_on: [frontend, admin, api]
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    ports:
      - "3000:3000"
      - "3001:3001"
      - "8000:8000"
    networks: [internal]

  api:
    build:
      target: prod
    restart: unless-stopped
    # aplica as migrations pendentes ANTES de subir o servidor (idempotente)
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips=*"
    # sem `ports`: só a rede interna; o `proxy` publica em HTTPS

  frontend:
    build:
      target: prod
    restart: unless-stopped
    # o SSR chama a API pela URL pública (https, cert autoassinado) — confia no cert
    environment:
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      - ./certs:/certs:ro

  admin:
    build:
      target: prod
    restart: unless-stopped
    environment:
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      - ./certs:/certs:ro

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
