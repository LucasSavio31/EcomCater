# ============================================================
#  Compose base — serviços comuns a dev e prod.
#  Dev:  docker compose up            (usa docker-compose.override.yml automaticamente)
#  Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  Regras:
#   - db e redis NUNCA publicam porta no host (só rede interna).
#   - Sem proxy reverso no Docker (LiteSpeed/aaPanel no host cuida disso).
#   - Todo container do projeto tem "cater" no nome (container_name).
# ============================================================
name: cater

services:
  db:
    image: postgres:16-alpine
    container_name: cater-bd
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: cater-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  api:
    build:
      context: ./api
      target: prod
    container_name: cater-api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/data/media
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: cater-front
    env_file: .env
    depends_on: [api]
    networks: [internal]

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL}
        NEXT_PUBLIC_ADMIN_BASE_PATH: ${NEXT_PUBLIC_ADMIN_BASE_PATH}
    container_name: cater-admin
    env_file: .env
    depends_on: [api]
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  media:

networks:
  internal:
    driver: bridge
