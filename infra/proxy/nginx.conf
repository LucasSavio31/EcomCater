# Proxy reverso com TLS (autoassinado) para publicar loja/painel/api em HTTPS
# direto no IP do servidor, enquanto não há domínio.
#   :3000 -> cater-front   :3001 -> cater-admin   :8000 -> cater-api
# O certificado autoassinado fica em /certs (gerado no servidor, fora do git).

events {}

http {
  access_log off;
  client_max_body_size 50m;
  proxy_read_timeout 120s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  ssl_certificate     /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  server {
    listen 3000 ssl;
    http2 on;
    # quem acessa http:// nesta porta TLS recebe 497 -> redireciona pra https
    error_page 497 =301 https://$host:3000$request_uri;
    location / {
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3001 ssl;
    http2 on;
    error_page 497 =301 https://$host:3001$request_uri;
    location / {
      proxy_pass http://admin:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 8000 ssl;
    http2 on;
    error_page 497 =301 https://$host:8000$request_uri;
    location / {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
