# Proxy reverso com TLS (autoassinado) para publicar loja/painel/api em HTTPS
# direto no IP do servidor, enquanto não há domínio.
#   :3000 -> cater-front   :3001 -> cater-admin   :8000 -> cater-api
#
# IMPORTANTE: os `proxy_pass` usam VARIÁVEL + `resolver` (DNS interno do Docker)
# para re-resolver o IP dos containers a cada request. Sem isso, o nginx
# guardava o IP na subida e dava 502 sempre que `frontend`/`admin`/`api` eram
# recriados num deploy.

events {}

http {
  access_log off;
  client_max_body_size 50m;
  proxy_read_timeout 120s;

  # menos impressão digital: some a versão do nginx e headers que denunciam a stack
  server_tokens off;
  proxy_hide_header X-Powered-By;
  proxy_hide_header X-Nextjs-Cache;
  proxy_hide_header X-Nextjs-Prerender;
  proxy_hide_header X-Nextjs-Stale-Time;
  proxy_hide_header X-Nextjs-Matched-Path;

  # DNS embutido do Docker — permite proxy_pass com variável (re-resolve sempre)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # --- compressão (JSON da API, HTML/JS/CSS) ---
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types
    application/json application/javascript application/xml
    text/plain text/css text/javascript image/svg+xml
    application/rss+xml application/manifest+json;

  # --- cache de resposta da API (respeita Cache-Control/s-maxage do upstream) ---
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                   max_size=200m inactive=10m use_temp_path=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  ssl_certificate     /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  server {
    listen 3000 ssl;
    http2 on;
    error_page 497 =301 https://$host:3000$request_uri;
    location / {
      set $upstream_front "frontend:3000";
      proxy_pass http://$upstream_front;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3001 ssl;
    http2 on;
    error_page 497 =301 https://$host:3001$request_uri;
    location / {
      set $upstream_admin "admin:3001";
      proxy_pass http://$upstream_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 8000 ssl;
    http2 on;
    error_page 497 =301 https://$host:8000$request_uri;
    location / {
      set $upstream_api "api:8000";
      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # cache só de GET/HEAD; nunca com Authorization. Honra s-maxage do upstream.
      proxy_cache api_cache;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $scheme$host$request_uri;
      proxy_cache_bypass $http_authorization;
      proxy_no_cache $http_authorization;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;
    }
  }
}
