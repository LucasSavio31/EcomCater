# Proxy reverso INTERNO — HTTP puro, só em 127.0.0.1 (nunca exposto direto).
# Quem termina TLS e fala com o mundo agora é o aaPanel/OpenLiteSpeed já
# instalado na VPS (porta 80/443 do host), configurado pelo admin em
# Infraestrutura -> Domínio: ele cria um vhost por host (loja/admin/api) com
# proxy reverso pra estas portas + emite o Let's Encrypt sozinho. Este nginx
# continua fazendo o que já fazia bem — gzip, cache de `/api/products` etc.,
# streaming do SSR, headers de segurança — só que sem certificado nenhum
# (o LiteSpeed é quem valida/renova).
#   :3000 -> cater-front   :3001 -> cater-admin   :8000 -> cater-api
#
# IMPORTANTE: os `proxy_pass` usam VARIÁVEL + `resolver` (DNS interno do Docker)
# para re-resolver o IP dos containers a cada request. Sem isso, o nginx
# guardava o IP na subida e dava 502 sempre que `frontend`/`admin`/`api` eram
# recriados num deploy.

events {}

http {
  access_log off;
  client_max_body_size 50m;
  proxy_read_timeout 120s;

  # menos impressão digital: some a versão do nginx e headers que denunciam a stack
  server_tokens off;
  proxy_hide_header X-Powered-By;
  proxy_hide_header X-Nextjs-Cache;
  proxy_hide_header X-Nextjs-Prerender;
  proxy_hide_header X-Nextjs-Stale-Time;
  proxy_hide_header X-Nextjs-Matched-Path;

  # --- cabeçalhos de segurança (aplicam a loja/admin/api) ---
  # Content-Security-Policy fica de fora por enquanto de propósito: a loja usa
  # GTM/GA4/Meta Pixel com scripts inline (dataLayer bootstrap), então uma CSP
  # exige levantamento cuidadoso das origens liberadas + teste completo do
  # rastreamento antes de entrar em produção — não é algo pra adicionar às
  # pressas sem validar contra o domínio final.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # DNS embutido do Docker — permite proxy_pass com variável (re-resolve sempre)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # O LiteSpeed (127.0.0.1) manda o IP real do visitante em X-Real-IP antes
  # de repassar pra cá — sem isto, $remote_addr seria sempre 127.0.0.1 (o
  # loopback do LiteSpeed), quebrando geolocalização/rate-limit/"visitantes
  # ao vivo" no admin. Depende do vhost do aaPanel manter esse header
  # (é o padrão da opção "proxy reverso" dele — confirmar na 1ª configuração).
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  # --- compressão (JSON da API, HTML/JS/CSS) ---
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types
    application/json application/javascript application/xml
    text/plain text/css text/javascript image/svg+xml
    application/rss+xml application/manifest+json;

  # --- cache de resposta da API (respeita Cache-Control/s-maxage do upstream) ---
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                   max_size=200m inactive=10m use_temp_path=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 127.0.0.1:3000;
    location / {
      set $upstream_front "frontend:3000";
      proxy_pass http://$upstream_front;
      proxy_http_version 1.1;
      # Sem isto o nginx junta a resposta inteira antes de mandar pro
      # navegador — o streaming SSR do Next (RSC/Suspense: manda o shell da
      # página logo, o resto depois) fica invisível pro cliente, que só vê
      # tudo de uma vez quando a parte mais lenta terminar (mesmo tempo total
      # de antes, só que agora com dois "spinners" na mesma pintura porque o
      # HTML do fallback da Suspense e o conteúdo final chegam juntos).
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 127.0.0.1:3001;
    location / {
      set $upstream_admin "admin:3001";
      proxy_pass http://$upstream_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 127.0.0.1:8000;
    set $upstream_api "api:8000";

    # Cache SÓ nos paths de catálogo público + mídia — nunca em carrinho,
    # pedidos, conta, admin, checkout, pagamento. Carrinho de convidado usa
    # cookie (`cart_token`, não `Authorization`), então o bypass abaixo não
    # o protegeria se essa location cobrisse a API inteira: uma resposta de
    # UM visitante acabaria sendo servida pra outro (mesma URL = mesma
    # cache key, cookie não entra na key). Por isso o cache fica isolado
    # aqui, num location próprio, e o `location /` geral (todo o resto)
    # nunca cacheia nada.
    location ~ ^/(api/(products|categories|theme|menus|banners|analytics/config)|media/|static/) {
      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # cache só de GET/HEAD; nunca com Authorization. Honra s-maxage do upstream.
      proxy_cache api_cache;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $scheme$host$request_uri;
      proxy_cache_bypass $http_authorization;
      proxy_no_cache $http_authorization;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      # nenhum GET público hoje seta cookie; defensivo contra cache
      # acidentalmente pulado (ou, pior, cookie replicado entre visitantes).
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      # teto acima do maior s-maxage atual (120s) — quem manda continua sendo
      # o Cache-Control que a API já envia, isto só evita entrada "eterna".
      proxy_cache_valid 200 301 302 10m;
      proxy_cache_valid 404 10s;
      # revalida com If-None-Match/If-Modified-Since (usa o ETag da API).
      proxy_cache_revalidate on;
    }

    location / {
      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      # SEM cache aqui de propósito — carrinho/pedidos/conta/admin/checkout/
      # pagamento identificam o usuário por cookie ou não devem nunca ser
      # compartilhados entre visitantes diferentes.
    }
  }
}
